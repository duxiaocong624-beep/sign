name: Sign Shortcut File

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Mac Shortcuts Sign
        run: |
          for f in *.shortcut; do
            if [ -f "$f" ]; then
              echo "Signing $f..."
              shortcuts sign --mode anyone --input "$f" --output "signed-$f"
            fi
          done

      - name: Upload Signed File
        uses: actions/upload-artifact@v4
        with:
          name: signed-shortcut-file
          path: signed-*.shortcut
